site_name: 四柱八字基础教材
site_url: https://bazi-textbook.jiayanyide.com/
site_description: 邝楚嘉（嘉言一得）四柱八字基础教材，四篇十七课、12+万字，含无答案练习与结构化附录。
site_author: 邝楚嘉（嘉言一得）
docs_dir: docs
copyright: 教材与练习 CC BY-NC-SA 4.0 · 附录数据 CC BY 4.0 · 自编脚本 MIT
theme:
  name: material
  language: zh
  custom_dir: overrides
  features:
    - navigation.path       # 面包屑
    - navigation.top        # 回到顶部
    - navigation.footer     # 页脚上一课／下一课
    - navigation.tracking   # 地址栏跟随锚点
    - toc.follow            # 目录跟随滚动
    - search.suggest        # 搜索联想
    - search.highlight      # 搜索命中高亮
  # 深色模式：跟随系统，可手动切换。
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
extra_css:
  - stylesheets/extra.css
# 折叠块用：admonition 提供容器语法，details 提供 ??? 可折叠变体。
markdown_extensions:
  - admonition
  - pymdownx.details
  # 目录只到三级：L01 这类长课四级以下太碎，反而不好找。
  - toc:
      toc_depth: 3
      permalink: false
nav:
  - 首页: index.md
  - 教材正文:
      - 第1课 · 概论: textbook/L01.md
      - 第2课 · 阴阳五行: textbook/L02.md
      - 第3课 · 天干及五合: textbook/L03.md
      - 第4课 · 地支: textbook/L04.md
      - 第5课 · 地支关系: textbook/L05.md
      - 第6课 · 八字排法: textbook/L06.md
      - 第7课 · 长生十二宫: textbook/L07.md
      - 第8课 · 十神排法: textbook/L08.md
      - 第9课 · 十神类象: textbook/L09.md
      - 第10课 · 十神组合（一）: textbook/L10.md
      - 第11课 · 十神组合（二）: textbook/L11.md
      - 第12课 · 十神组合（三）: textbook/L12.md
      - 第13课 · 十神实战: textbook/L13.md
      - 第14课 · 旺衰抑扶: textbook/L14.md
      - 第15课 · 旺衰的用法: textbook/L15.md
      - 第16课 · 神煞: textbook/L16.md
      - 第17课 · 大运流年: textbook/L17.md
  - 练习:
    - 说明: exercises/README.md
    - 题目: exercises/exercises.md
  - 附录数据:
    - 六十甲子: appendix-data/bazi-jiazi.csv
    - 十神查法: appendix-data/bazi-shishen.csv
    - 长生十二宫: appendix-data/bazi-changsheng.csv
    - 神煞查法: appendix-data/bazi-shensha.csv
  - 关于嘉言一得: author.md
  - 联系与勘误: contact.md
  - 版权与版本说明: rights.md
  - 课程与教学服务: courses.md

# 构建期注入逐页 description，避免改写受 SHA256 冻结的正文文件。
hooks:
  - hooks/page_meta.py

extra:
  # 访问统计：填入其一即启用，两者均留空则不加载任何统计脚本。
  # goatcounter 填站点代码（如 jiayanyide），无 Cookie；ga4 填 G- 开头的测量 ID。
  goatcounter: "chujia"
  ga4: ""
